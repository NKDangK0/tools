<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Tools - Boss Man</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Link Resolver Tool</h1>
        <p>Dán đường link cần kiểm tra vào bên dưới:</p>
        
        <input type="text" id="urlInput" placeholder="https://example.com/link..." />
        <button id="btn">Xử Lý Link</button>
        
        <div id="resultBox" class="hidden">
            <p id="msg"></p>
            <a id="targetLink" href="#" target="_blank" class="hidden">Truy cập đường link gốc</a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
